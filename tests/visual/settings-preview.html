<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>设置页预览</title></head>
<body>
<!--
  渲染当前 settings/index.html（原始视觉 + 最小功能改动）。
  state: free(默认) | pro | unrestricted | empty | unavailable
-->
<script src="chrome-stub.js"></script>
<script>
const params = new URLSearchParams(location.search);
window.__ERR__ = [];
window.addEventListener('error', function (e) { window.__ERR__.push(String(e.message) + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno); });
window.addEventListener('unhandledrejection', function (e) { window.__ERR__.push('rej: ' + String(e.reason)); });

fetch('../../settings/index.html')
  .then(function (r) { return r.text(); })
  .then(function (html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.title = doc.title;
    // 原始页面样式全部内联，直接搬
    doc.head.querySelectorAll('style, link[rel=stylesheet], meta[charset], meta[name=color-scheme]').forEach(function (n) {
      document.head.appendChild(n.cloneNode(true));
    });
    document.body.innerHTML = doc.body.innerHTML;

    // 页面脚本按文档顺序加载；相对路径指回仓库根
    const scripts = Array.prototype.slice.call(doc.querySelectorAll('script[src]'));
    const loadNext = function () {
      const node = scripts.shift();
      if (!node) { document.dispatchEvent(new Event('DOMContentLoaded')); return; }
      let src = node.getAttribute('src');
      // locales.js / shared-ui.js 是构建产物，预览时读 dist/safari 下的副本
      if (src === '../locales.js') src = '../../dist/safari/locales.js';
      else if (src === '../shared-ui.js') src = '../../dist/safari/shared-ui.js';
      else if (src === '../i18n-manager.js') src = '../../i18n-manager.js';
      else if (src === 'app.js') src = '../../settings/app.js';
      else src = src.replace(/^\.\.\//, '../../');
      const el = document.createElement('script');
      el.src = src;
      el.onload = loadNext;
      el.onerror = loadNext;
      document.body.appendChild(el);
    };
    loadNext();
  });

function showErrors() {
  const pre = document.createElement('pre');
  pre.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff0;color:#000;font-size:11px;padding:4px;margin:0;white-space:pre-wrap';
  pre.textContent = 'errors: ' + JSON.stringify(window.__ERR__, null, 1)
    + '\nvalues: scrollSpeed=' + (document.getElementById('scrollSpeed')||{}).value
    + ' stayDuration=' + (document.getElementById('stayDuration')||{}).value
    + ' licenseStatus=' + (document.getElementById('licenseStatus')||{}).textContent
    + ' | toast=' + ((document.querySelector('.toast') || {}).textContent || '')
    + ' acks=' + (window.__ACK_COUNT__ || 0);
  document.body.appendChild(pre);
}
// ?roundtrip=1 验证"导出 → 清空 → 导入 无损"（A7 的验收条件）。
// 步骤照抄 exportConfig 的导出结构，再走页面自己的 importConfig。
async function roundtrip() {
  if (window.__ROUNDTRIP_RUNNING__) return;
  window.__ROUNDTRIP_RUNNING__ = true;
  const rt = window.chrome.runtime;
  const before = (await rt.sendMessage({ type: 'GET_ALL_CONFIGS' })).data;
  const globalConfig = (await rt.sendMessage({ type: 'GET_GLOBAL_CONFIG' })).data;
  const exportJson = JSON.stringify({
    siteConfigs: before,
    globalConfig,
    exportDate: new Date().toISOString(),
  });

  window.__CLEAR_SITES__();
  const cleared = (await rt.sendMessage({ type: 'GET_ALL_CONFIGS' })).data;
  window.__RESET_CALLS__();

  const file = new File([exportJson], 'config.json', { type: 'application/json' });
  await window.importConfig(file);

  const after = (await rt.sendMessage({ type: 'GET_ALL_CONFIGS' })).data;
  const restored = Object.keys(after).sort().join(',') === Object.keys(before).sort().join(',')
    && Object.keys(before).every(function (k) {
      return after[k] && after[k].strategy === before[k].strategy
        && after[k].scrollFallback === before[k].scrollFallback
        && after[k].addedAt === before[k].addedAt;
    });
  const payloads = (window.__SET_CALLS__ || []).map(function (c) {
    return c.domain + ':' + c.scrollFallback + ':' + (c.addedAt === undefined ? 'none' : 'kept') + ':' + c.source;
  });

  // 第二轮：导出的键可能带 www. / 大写 / 结尾点，必须规范化成与 background 一致的键
  window.__CLEAR_SITES__();
  window.__RESET_CALLS__();
  const messy = JSON.stringify({
    globalConfig: globalConfig,
    siteConfigs: {
      'www.MixedCase.COM': { strategy: 'scroll-fallback', scrollFallback: true, addedAt: 7 },
      'Example.COM.': { strategy: 'tech-block', scrollFallback: false, addedAt: 9 },
    },
  });
  await window.importConfig(new File([messy], 'messy.json', { type: 'application/json' }));
  const messyAfter = (await rt.sendMessage({ type: 'GET_ALL_CONFIGS' })).data;
  const normalizedKeys = Object.keys(messyAfter).sort().join(',');
  const messyPayloads = (window.__SET_CALLS__ || []).map(function (c) {
    return c.domain + ':' + c.scrollFallback + ':' + (c.addedAt === undefined ? 'none' : 'kept') + ':' + c.source;
  });

  const pre = document.createElement('pre');
  pre.id = 'roundtrip-report';
  pre.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff0;color:#000;font-size:11px;padding:4px;margin:0;white-space:pre-wrap';
  pre.textContent = 'roundtrip restored=' + restored
    + ' clearedKeys=' + Object.keys(cleared).length
    + ' before=' + JSON.stringify(before)
    + ' after=' + JSON.stringify(after)
    + ' payloads=' + JSON.stringify(payloads)
    + ' | messyKeys=' + normalizedKeys
    + ' messyPayloads=' + JSON.stringify(messyPayloads)
    + ' messyConfigs=' + JSON.stringify(messyAfter)
    + ' errors=' + JSON.stringify(window.__ERR__);
  document.body.appendChild(pre);
}

// ?times=1 验证 D4：界面用秒、存储仍毫秒，保存后回读一致。
async function timesCheck() {
  const rt = window.chrome.runtime;
  const speedEl = document.getElementById('scrollSpeed');
  const stayEl = document.getElementById('stayDuration');
  const rows = [];
  rows.push('initial labels=' + speedEl.previousElementSibling.textContent
    + ' / ' + stayEl.previousElementSibling.textContent);
  rows.push('initial inputs=' + speedEl.value + ' / ' + stayEl.value);

  await window.saveGlobalSettings();
  const stored = (await rt.sendMessage({ type: 'GET_GLOBAL_CONFIG' })).data;
  rows.push('stored ms=' + stored.scrollSpeed + ' / ' + stored.stayDuration);

  await window.loadGlobalSettings();
  rows.push('reread inputs=' + speedEl.value + ' / ' + stayEl.value);

  // 非整数秒也不能丢精度
  speedEl.value = '0.25';
  stayEl.value = '1.5';
  await window.saveGlobalSettings();
  const stored2 = (await rt.sendMessage({ type: 'GET_GLOBAL_CONFIG' })).data;
  await window.loadGlobalSettings();
  rows.push('0.25/1.5 -> ms=' + stored2.scrollSpeed + '/' + stored2.stayDuration
    + ' reread=' + speedEl.value + '/' + stayEl.value);

  const pre = document.createElement('pre');
  pre.id = 'times-report';
  pre.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff0;color:#000;font-size:11px;padding:4px;margin:0;white-space:pre-wrap';
  pre.textContent = rows.join(' | ') + ' errors=' + JSON.stringify(window.__ERR__);
  document.body.appendChild(pre);
}
if (params.get('times') === '1') {
  document.addEventListener('DOMContentLoaded', function () { setTimeout(timesCheck, 200); });
}

if (params.get('measure') === '1') setTimeout(showErrors, 800);
if (params.get('roundtrip') === '1') {
  document.addEventListener('DOMContentLoaded', function () { setTimeout(roundtrip, 200); });
}
</script>
</body>
</html>
