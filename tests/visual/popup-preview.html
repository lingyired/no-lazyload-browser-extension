<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>popup preview harness</title>
</head>
<body>
<!--
  只用于视觉/交互自查的预览壳，不参与打包。

  用法（headless Chrome）：
    chrome --headless --screenshot=out.png --window-size=380,520 \
      --blink-settings=preferredColorScheme=2 \
      "file://.../tests/visual/popup-preview.html?state=free"

  state:  free(默认) | pro | unrestricted | empty | limit | unavailable
  dialog=1  打开升级弹窗
  measure=1 在页面顶部打印关键元素尺寸
-->
<script src="chrome-stub.js"></script>
<script>
const params = new URLSearchParams(location.search);
window.__ERRORS__ = [];
window.addEventListener('error', function (e) { window.__ERRORS__.push(String(e.message)); });
window.addEventListener('unhandledrejection', function (e) { window.__ERRORS__.push('rejection: ' + String(e.reason)); });

fetch('../../popup.html')
  .then(function (r) { return r.text(); })
  .then(function (html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.title = doc.title;

    // ⚠️ popup 的样式是内联在 popup.html 的 <style> 里的（没有外部 CSS），必须一起搬，
    // 否则预览出的是"没样式"的页面，根本看不出视觉是否与原始一致。
    doc.head.querySelectorAll('style, link[rel=stylesheet], meta[charset], meta[name=color-scheme]').forEach(function (node) {
      const clone = node.cloneNode(true);
      if (clone.tagName === 'LINK' && clone.getAttribute('href')) {
        clone.setAttribute('href', '../../' + clone.getAttribute('href'));
      }
      document.head.appendChild(clone);
    });
    document.body.innerHTML = doc.body.innerHTML;

    // 必须与真实 popup.html 的脚本清单一致：i18n-manager.js → popup.js。
    // popup.js 自带 MESSAGE_TYPES/STRATEGIES 等常量，再加载 shared-ui.js 会
    // "Identifier 'MESSAGE_TYPES' has already been declared" —— 整个 popup 初始化失败。
    const scripts = [
      '../../dist/safari/locales.js',
      '../../i18n-manager.js',
      '../../popup.js',
    ];

    const loadNext = function () {
      const src = scripts.shift();
      if (!src) {
        document.dispatchEvent(new Event('DOMContentLoaded'));
        if (params.get('dialog') === '1') {
          setTimeout(function () { window.openUpgradeDialog(); }, 100);
        }
        if (params.get('measure') === '1') setTimeout(measure, 300);
        return;
      }
      const el = document.createElement('script');
      el.src = src;
      el.onload = loadNext;
      el.onerror = loadNext;
      document.body.appendChild(el);
    };
    loadNext();
  });

function measure() {
  const rows = [];
  ['.nl-popup', '.nl-switch', '.nl-list-item', '.nl-overlay', '.nl-dialog'].forEach(function (sel) {
    const el = document.querySelector(sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    rows.push(sel + ' x=' + Math.round(r.left) + ' w=' + Math.round(r.width) + ' h=' + Math.round(r.height));
  });
  const sw = document.getElementById('siteSwitch');
  if (sw) {
    const cs = getComputedStyle(sw);
    const after = getComputedStyle(sw, '::after');
    rows.push('switch: bg=' + cs.backgroundColor + ' transform(after)=' + after.transform + ' afterBg=' + after.backgroundColor + ' opacity=' + cs.opacity + ' disabled=' + sw.disabled);
  }
  rows.push('switch aria-checked=' + (document.getElementById('siteSwitch') || {}).getAttribute?.('aria-checked')
    + ' pill=' + (document.getElementById('currentStatus') || {}).className
    + ' domain=' + (document.getElementById('currentDomain') || {}).textContent);
  rows.push('count=' + (document.getElementById('siteCount') || {}).textContent
    + ' items=' + document.querySelectorAll('#siteList .nl-list-item').length);
  rows.push('i18n=' + (typeof window.i18nManager)
    + ' msgs=' + (window.i18nManager ? Object.keys(window.i18nManager.messages || {}).length : -1)
    + ' lang=' + (window.i18nManager ? window.i18nManager.currentLang : '?'));
  rows.push('toast=' + ((document.querySelector('.toast') || {}).textContent || '')
    + ' acks=' + (window.__ACK_COUNT__ || 0));
  rows.push('errors=' + JSON.stringify(window.__ERRORS__));
  const pre = document.createElement('pre');
  pre.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff0;color:#000;font-size:10px;padding:4px;white-space:pre-wrap;margin:0';
  pre.textContent = rows.join(' | ');
  document.body.appendChild(pre);
}
</script>
</body>
</html>
