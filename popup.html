<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>No Lazyload</title>
  <link rel="stylesheet" href="ui/tokens.css">
  <link rel="stylesheet" href="ui/components.css">
  <link rel="stylesheet" href="ui/safari.css">
</head>
<body>
  <!-- 当前网站 -->
  <div class="current-site">
    <h2 data-i18n="currentSite">当前网站</h2>
    <div class="site-info">
      <span class="site-domain" id="currentDomain" data-i18n="loading">加载中...</span>
      <span class="site-status disabled" id="currentStatus">
        <span class="dot" id="statusDot">○</span>
        <span id="statusText" data-i18n="disabled">未启用</span>
      </span>
    </div>

    <!-- plan C1：用开关替代"添加/移除当前网站"按钮 -->
    <div class="switch-row">
      <span class="switch-label" data-i18n="enableForThisSite">在此网站启用</span>
      <button type="button" id="siteSwitch" class="nl-switch" role="switch" aria-checked="false"
              aria-labelledby="statusText" disabled></button>
    </div>
    <p class="switch-help" data-i18n="siteSwitchHelp">
      在此网站禁用懒加载，直接加载全部图片。
    </p>

    <!-- plan C2：技术术语改名 Standard / Compatibility -->
    <div class="mode-row">
      <label class="mode-label" for="modeSelect" data-i18n="mode">模式</label>
      <select id="modeSelect" class="mode-select" disabled>
        <option value="tech-block" data-i18n="standardMode">标准</option>
        <option value="scroll-fallback" data-i18n="compatibilityMode">兼容模式</option>
      </select>
    </div>
    <p class="mode-help" id="modeHelp"></p>
  </div>

  <!-- 已启用网站 -->
  <div class="site-list-section">
    <div class="site-list-header">
      <h2 data-i18n="enabledWebsites">已启用的网站</h2>
      <span class="plan-badge" id="planBadge" hidden>PRO</span>
      <span class="count" id="siteCount">0</span>
    </div>
    <div class="site-list" id="siteList"></div>
    <div class="empty-state" id="emptyState" data-i18n="noSites">暂无配置的网站</div>
  </div>

  <!-- 升级入口：仅 Safari 免费版显示 -->
  <div class="upgrade-row" id="upgradeGroup" hidden>
    <button type="button" id="manageLicense" class="manage-btn">
      <span data-i18n="licenseUpgrade">升级到 Pro</span>
    </button>
    <p class="upgrade-note" id="upgradeNote"></p>
  </div>

  <!-- 购买 / 权限不可用提示 -->
  <p class="license-notice" id="licenseNotice" hidden></p>

  <!-- 页脚 -->
  <div class="footer">
    <button type="button" class="footer-btn" id="openSettings">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span data-i18n="fullSettings">完整设置</span>
    </button>
    <button type="button" class="footer-btn primary" id="refreshPage">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span data-i18n="refreshPage">刷新页面</span>
    </button>
  </div>

  <!-- 作者行（plan D7：去掉开发者工具宣传） -->
  <div class="author">
    <span class="version">v<span id="extensionVersion">1.0.0</span></span> |
    <a href="https://space.bilibili.com/103021226" target="_blank" rel="noopener">灵亦rEd</a>
  </div>

  <script src="locales.js"></script>
  <script src="shared-ui.js"></script>
  <script src="i18n-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
